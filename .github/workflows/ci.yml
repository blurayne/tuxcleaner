name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-targets
      - run: sh -n install.sh scripts/package-release.sh
      - run: sh tests/install.sh

  distro-smoke:
    name: ${{ matrix.family }} smoke test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - family: arch
            image: archlinux:base-devel
          - family: ubuntu
            image: ubuntu:24.04
          - family: fedora
            image: fedora:42
    container: ${{ matrix.image }}
    steps:
      - name: Install bootstrap tools
        run: |
          case "${{ matrix.family }}" in
            arch) pacman -Syu --noconfirm curl ca-certificates git ;;
            ubuntu) apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y curl ca-certificates git build-essential ;;
            fedora) dnf install -y curl ca-certificates git gcc gcc-c++ make ;;
          esac
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.92.0
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - run: cargo test --test distro_fixtures
      - run: cargo run -- status --json
